name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install clang-format
        run: sudo apt-get update -y && sudo apt-get install -y clang-format
      - name: Check formatting of changed files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "No usable base commit; skipping."; exit 0
          fi
          files=$(git diff --name-only --diff-filter=ACM "$base" HEAD | grep -E '\.(cpp|hpp)$' || true)
          if [ -z "$files" ]; then echo "No C++ files changed."; exit 0; fi
          echo "$files"
          clang-format --dry-run --Werror $files

  test-linux-llvm:
    name: Linux + LLVM (Release)
    runs-on: ubuntu-latest
    env:
      TARGET: linux,llvm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential llvm clang cmake ninja-build ccache python3-pip

      # Cache the compiler cache, not the build tree — a stale build/ with a
      # fresh CMakeCache.txt is a reliable source of confusing failures.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Build zpiler
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Run tests
        run: python3 -m pytest -q

  test-linux-sanitizers:
    name: Linux ASan+UBSan (Debug)
    runs-on: ubuntu-latest
    env:
      TARGET: linux
      # Generated programs are not instrumented; only zpiler itself is.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang cmake ninja-build python3-pip

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Build zpiler with sanitizers
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DZUST_SANITIZE=address,undefined \
            -DZUST_ASSERTIONS=ON
          cmake --build build -j

      - name: Run tests under sanitizers
        run: python3 -m pytest -q

  test-windows:
    name: Windows (Release)
    runs-on: windows-latest
    env:
      TARGET: windows
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build zpiler
        shell: cmd
        run: |
          cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run tests
        shell: cmd
        run: |
          chcp 65001
          python -m pytest -q
